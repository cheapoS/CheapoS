name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Hosted images register LFS filters globally even for plain Git fixtures.
      # Change only the disposable runner; keep the app's filter guard and tests.
      - name: Remove preinstalled LFS filters from the test runner
        shell: bash
        run: |
          for scope in global system; do
            if git config --"$scope" --get-regexp '^filter\.lfs\.' >/dev/null; then
              if [ "$scope" = system ]; then
                sudo git config --system --remove-section filter.lfs
              else
                git config --global --remove-section filter.lfs
              fi
            fi
          done
      - run: python -B scripts/check.py --full --jobs 4
      - run: git diff --check
