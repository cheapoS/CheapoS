name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B scripts/check.py --full --jobs 4
      - run: git diff --check
