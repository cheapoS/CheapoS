name: Release macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.desc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            desc: Apple Silicon
          - os: macos-13
            arch: x86_64
            desc: Intel

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deterministic Unit Tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: pip install --upgrade pyinstaller

      - name: Build cheapoS.app (Standalone)
        run: python3 scripts/build_macos_app.py --mode standalone

      - name: Package cheapoS-macos-${{ matrix.arch }}.dmg
        run: |
          python3 scripts/create_dmg.py \
            --app dist_release/cheapoS.app \
            --output dist_release/cheapoS-macos-${{ matrix.arch }}.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist_release/cheapoS-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All DMG Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        working-directory: release_assets
        run: |
          sha256sum cheapoS-macos-*.dmg > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "cheapoS ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/cheapoS-macos-arm64.dmg
            release_assets/cheapoS-macos-x86_64.dmg
            release_assets/checksums.txt
